<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- TODO 1: Give the app YOUR title. Change <title> here and the <h1> below (id="app-title"). -->
    <title>DemoChat</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">

    <header class="app-header">
        <h1 id="app-title">DemoChat</h1>
        <!-- The status text and its color are changed by app.js -->
        <span id="status" class="status status--disconnected" role="status">Disconnected</span>
    </header>

    <!-- Step 1: choose a nickname and connect.
         There is NO required / maxlength here on purpose: the SERVER must check the data (TODO 2),
         because anybody can bypass a web page. -->
    <form id="connect-form" class="row" autocomplete="off">
        <label for="nickname" class="visually-hidden">Nickname</label>
        <input id="nickname" type="text" placeholder="Your nickname">
        <button id="connect-btn" type="submit">Connect</button>
        <button id="disconnect-btn" type="button" class="secondary" disabled>Disconnect</button>
    </form>

    <!-- Server and connection errors appear here -->
    <div id="error" class="error" role="alert" hidden></div>

    <!-- The messages. They exist only in this page: reload the page and they are gone. -->
    <section id="messages" class="messages" role="log" aria-live="polite">
        <p id="empty-hint" class="empty-hint">
            Connect, then write a message. Messages are not saved: you only see the messages that are
            sent while you are connected.
        </p>
    </section>

    <!-- Step 2: write a message. It is disabled until you are connected. -->
    <form id="message-form" autocomplete="off">
        <div class="row">
            <label for="message-input" class="visually-hidden">Message</label>
            <input id="message-input" type="text" placeholder="Write a message..." disabled>
            <button id="send-btn" type="submit" disabled>Send</button>
        </div>
        <!-- TODO 4: app.js should write something like "12 / 500" here while the user types. -->
        <small id="char-counter" class="counter"></small>
    </form>

</main>

<!-- The STOMP library. It comes from the Maven dependency "stomp__stompjs" (see pom.xml),
     so it is served by this same application. No internet is needed. -->
<script src="/webjars/stomp__stompjs/7.3.0/bundles/stomp.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
